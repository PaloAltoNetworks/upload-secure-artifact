name: upload-secure-artifact
description: A composite action that runs gitleaks for scanning secrets and then executes an index.js file.
inputs:
  name:
    description: 'Artifact name'
    default: 'artifact'
  path:
    description: 'A file, directory or wildcard pattern that describes what to upload'
    required: true
  scan-only-runner-token:
    description: >
      If true don't use GitLeaks to scan secrets    
    default: 'false'
  retention-days:
    description: >
      Duration after which artifact will expire in days. 0 means using default retention.

      Minimum 1 day.
      Maximum 90 days unless changed from the repository settings page.
  compression-level:
    description: >
      The level of compression for Zlib to be applied to the artifact archive.
      The value can range from 0 to 9:
      - 0: No compression
      - 1: Best speed
      - 6: Default compression (same as GNU Gzip)
      - 9: Best compression
      Higher levels will result in better compression, but will take longer to complete.
      For large files that are not easily compressed, a value of 0 is recommended for significantly faster uploads.
    default: '6'
  if-no-files-found:
    description: >
      The desired behavior if no files are found using the provided path.

      Available Options:
        warn: Output a warning but do not fail the action
        error: Fail the action with an error message
        ignore: Do not output any warnings or errors, the action does not fail
    default: 'warn'
  include-hidden-files:
    description: >
      If true, hidden files will be included in the artifact.
      If false, hidden files will be excluded from the artifact.
    default: 'false'

outputs:
  artifact-id:
    description: >
      A unique identifier for the artifact that was just uploaded. Empty if the artifact upload failed.

      This ID can be used as input to other APIs to download, delete or get more information about an artifact: https://docs.github.com/en/rest/actions/artifacts
  artifact-url:
    description: >
      A download URL for the artifact that was just uploaded. Empty if the artifact upload failed.

      This download URL only works for requests Authenticated with GitHub. Anonymous downloads will be prompted to first login.
      If an anonymous download URL is needed than a short time restricted URL can be generated using the download artifact API: https://docs.github.com/en/rest/actions/artifacts#download-an-artifact

      This URL will be valid for as long as the artifact exists and the workflow run and repository exists. Once an artifact has expired this URL will no longer work.
      Common uses cases for such a download URL can be adding download links to artifacts in descriptions or comments on pull requests or issues.
runs:
  using: "composite"
  steps:
    - name: Prepare artifact paths
      shell: bash
      env:
        INPUT_PATH: ${{ inputs.path }}
      run: |
        node <<'NODE'
        const crypto = require('crypto');
        const fs = require('fs');
        const path = require('path');

        const input = process.env.INPUT_PATH || '';
        if (input.includes('\0')) {
          throw new Error('Artifact path input contains unsupported null bytes.');
        }

        const paths = input
          .split(/[\r\n|]+/)
          .map((value) => value.trim())
          .filter((value) => value.length > 0)
          .map((value) => path.resolve(value));
        const delimiter = `ARTIFACT_PATHS_${crypto.randomBytes(16).toString('hex')}`;

        fs.appendFileSync(
          process.env.GITHUB_ENV,
          `ARTIFACT_PATHS<<${delimiter}\n${paths.join('\n')}\n${delimiter}\n`
        );
        NODE

    - name: Secrets Scanning
      if: inputs.scan-only-runner-token == 'false'
      run: |
        node <<'NODE'
        const { spawnSync } = require('child_process');
        const fs = require('fs');
        const sanitizeForLog = (value) => JSON.stringify(value);

        const paths = (process.env.ARTIFACT_PATHS || '')
          .split(/\r?\n/)
          .map((value) => value.trim())
          .filter((value) => value.length > 0);

        for (const artifactPath of paths) {
          if (!fs.existsSync(artifactPath)) {
            continue;
          }

          if (artifactPath.includes(':')) {
            console.error(`Artifact path contains unsupported ':' character: ${sanitizeForLog(artifactPath)}`);
            process.exit(1);
          }

          console.log(`Scanning path ${sanitizeForLog(artifactPath)}`);
          const result = spawnSync(
            'docker',
            [
              'run',
              '-v',
              `${artifactPath}:/scan`,
              'zricethezav/gitleaks@sha256:75bdb2b2f4db213cde0b8295f13a88d6b333091bbfbf3012a4e083d00d31caba',
              'detect',
              '--no-git',
              '--source',
              '/scan',
            ],
            { stdio: 'inherit' },
          );

          if (result.error) {
            throw result.error;
          }

          if (result.status !== 0) {
            process.exit(result.status || 1);
          }
        }
        NODE
      shell: bash
      env:
        ARTIFACT_PATHS: ${{ env.ARTIFACT_PATHS }}

    - name: Set up Node.js
      uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
      with:
        node-version: 24

    - name: npm install
      shell: bash
      run: |
        cd ${{ github.action_path }}
        npm ci

    - uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
      with:
        script: |
          const script = require('${{github.action_path}}/index.js')
          const artifactName = process.env.NAME;
          const artifactPath = process.env.ARTIFACT_PATHS;
          const retentionDays = process.env.RETENTION_DAYS;
          const compressionLevel = process.env.COMPRESSION_LEVEL;
          const ifNoFilesFound = process.env.IF_NO_FILES_FOUND;
          const includeHiddenFiles = process.env.INCLUDE_HIDDEN_FILES;
          script({
            github,
            context,
            artifactName,
            artifactPath,
            retentionDays,
            compressionLevel,
            ifNoFilesFound,
            includeHiddenFiles,
          })
      env:
        NAME: ${{ inputs.name }}
        ARTIFACT_PATHS: ${{ env.ARTIFACT_PATHS }}
        RETENTION_DAYS: ${{ inputs.retention-days }}
        COMPRESSION_LEVEL: ${{ inputs.compression-level }}
        IF_NO_FILES_FOUND: ${{ inputs.if-no-files-found }}
        INCLUDE_HIDDEN_FILES: ${{ inputs.include-hidden-files }}
